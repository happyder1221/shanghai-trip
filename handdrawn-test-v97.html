<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V9.7 手繪圖片測試</title><style>html,body{margin:0;min-height:100%;background:#f6eddc;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;color:#34261d}body{padding:18px}h1{margin:0 0 8px}.sub{color:#76685c;font-size:14px;margin-bottom:16px}.ok{background:#fff7ea;border:1px solid #ddc9a7;border-radius:14px;padding:12px;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{border:1px solid #d9c5a4;background:#fffaf1;border-radius:999px;padding:8px 12px;font-weight:800}.tabs button.active{background:#8e3b31;color:#fff}.card{background:#fffaf2;border:1px solid #e0ceb0;border-radius:18px;padding:10px;margin-bottom:16px}.card img{display:block;width:100%;border-radius:12px}.bgpreview{height:280px;background-position:center;background-size:cover;border-radius:18px;border:1px solid #e0ceb0;margin-bottom:16px}.err{color:#b33;font-weight:800;white-space:pre-wrap}</style></head><body><h1>V9.7 手繪資產直讀測試</h1><div class="sub">這頁完全不讀原本 APP，也不使用 Service Worker，只測真正手繪圖。</div><div id="status" class="ok">正在載入手繪資產…</div><div id="bg" class="bgpreview"></div><div id="tabs" class="tabs"></div><div class="card"><img id="map" alt="手繪地圖"></div><div id="err" class="err"></div><script src="./v95-assets/bg-handdrawn.js?v=9701"></script><script src="./v95-assets/maps-a-handdrawn.js?v=9701"></script><script src="./v95-assets/maps-b-handdrawn.js?v=9701"></script><script src="./v95-assets/maps-c-handdrawn.js?v=9701"></script><script src="./v95-assets/maps-d-handdrawn.js?v=9701"></script><script>const keys=['總覽','9/12','9/13','9/14','9/15','9/16','9/17','9/18'];const st=document.getElementById('status'),bg=document.getElementById('bg'),map=document.getElementById('map'),tabs=document.getElementById('tabs'),err=document.getElementById('err');function render(k){try{const a=window.APP_IMAGES||{};if(!a.bg)throw new Error('找不到背景圖資料');if(!a[k])throw new Error('找不到 '+k+' 地圖資料');bg.style.backgroundImage=`linear-gradient(rgba(250,245,235,.15),rgba(250,245,235,.15)),url("${a.bg}")`;map.src=a[k];st.textContent='✅ 手繪背景與 '+k+' 地圖已直接載入';[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.k===k));}catch(e){st.textContent='❌ 手繪資產載入失敗';err.textContent=e.stack||e.message;}}keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k;b.onclick=()=>render(k);tabs.appendChild(b)});window.addEventListener('load',()=>render('總覽'));</script></body></html>
