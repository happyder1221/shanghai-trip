function amapUrl(keyword,city){return 'https://uri.amap.com/search?keyword='+encodeURIComponent(keyword)+'&city='+encodeURIComponent(city)+'&view=map&callnative=1';}
function linkPlaces(text){let out=text;Object.keys(PLACES).sort((a,b)=>b.length-a.length).forEach(name=>{if(!out.includes(name))return;const [kw,city]=PLACES[name];const link='<a class="maplink" href="'+amapUrl(kw,city)+'" target="_blank" rel="noopener">'+name+'</a>';out=out.split(name).join(link)});return out;}
const keys=Object.keys(DATA);let current=keys[0],mode='plan';const tabs=document.getElementById('tabs'),main=document.getElementById('main');function cls(i,d){if(i.includes('☕')||i.includes('🛋️'))return'rest';if(i.includes('🚶')||d.includes('Citywalk'))return'walk';if(/[🚕🚇🚄✈️🚤⛴️]/.test(i))return'ride';return''}function renderTabs(){tabs.innerHTML='';keys.forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===current?' active':'');b.textContent=k;b.onclick=()=>{current=k;mode='plan';setB();render()};tabs.appendChild(b)})}function plan(){main.innerHTML=`<div class="daytitle"><h2>${current}</h2><span class="tag">${META[current]}</span></div><div class="note">紅色底線的景點／店家名稱可直接開啟高德地圖。</div>`+DATA[current].map(x=>`<div class="item ${cls(x[1],x[2])}"><div class="time">${x[0]}</div><div class="icon">${x[1]}</div><div class="desc">${linkPlaces(x[2])}</div></div>`).join('')}function map(){main.innerHTML='<div class="daytitle"><h2>行程地圖</h2><span class="tag">上海＋杭州＋蘇州</span></div><div class="mapwrap"><img src="shanghai_route_map.png"></div><div class="note">此圖為行程視覺總覽；實際導航建議當天依即時交通使用高德地圖／Apple 地圖／滴滴。</div>'}function todo(){main.innerHTML='<div class="daytitle"><h2>預約清單</h2><span class="tag">出發前完成</span></div>'+TODOS.map((x,i)=>`<label class="check"><input type="checkbox" data-i="${i}"><span>${x}</span></label>`).join('');document.querySelectorAll('.check input').forEach(e=>{let k='todo-v92-'+e.dataset.i;e.checked=localStorage.getItem(k)==='1';e.onchange=()=>localStorage.setItem(k,e.checked?'1':'0')})}function backup(){main.innerHTML='<div class="daytitle"><h2>備用景點</h2><span class="tag">有空再補</span></div><div class="note">點擊紅色景點名稱可直接開啟高德地圖搜尋／導航。</div>'+BACKUP.map(x=>`<div class="item"><div class="time">備選</div><div class="icon">📍</div><div class="desc">${linkPlaces(x)}</div></div>`).join('')}function render(){renderTabs();mode==='map'?map():mode==='todo'?todo():mode==='backup'?backup():plan()}function setB(){btnPlan.classList.toggle('active',mode==='plan');btnMap.classList.toggle('active',mode==='map');btnTodo.classList.toggle('active',mode==='todo');btnBackup.classList.toggle('active',mode==='backup')}btnPlan.onclick=()=>{mode='plan';setB();render()};btnMap.onclick=()=>{mode='map';setB();render()};btnTodo.onclick=()=>{mode='todo';setB();render()};btnBackup.onclick=()=>{mode='backup';setB();render()};const trip=new Date('2026-09-12T07:05:00+08:00'),now=new Date(),diff=trip-now;countdown.textContent=diff>0?'距離出發還有 '+Math.ceil(diff/86400000)+' 天':'旅程已開始／完成';if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
