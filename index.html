};function amapUrl(keyword,city){return 'https://uri.amap.com/search?keyword='+encodeURIComponent(keyword)+'&city='+encodeURIComponent(city)+'&view=map&callnative=1';}function linkPlaces(text){let out=text;Object.keys(PLACES).sort((a,b)=>b.length-a.length).forEach(name=>{if(!out.includes(name))return;const [kw,city]=PLACES[name];const link='<a class="maplink" href="'+amapUrl(kw,city)+'" target="_blank" rel="noopener">'+name+'</a>';out=out.split(name).join(link)});return out;}const keys=Object.keys(DATA);let current=keys[0],mode='plan',backupMode='spots',mapCurrent='總覽';const tabs=document.getElementById('tabs'),main=document.getElementById('main');function cls(i,d){if(i.includes('☕')||i.includes('🛋️'))return 'rest';if(i.includes('🚶')||d.includes('Citywalk'))return 'walk';if(/[🚕🚇🚄✈️🚤⛴️]/.test(i))return 'ride';return '';}function pillClass(type){return type==='now'?'now':type==='fast'?'fast':type==='ok'?'ok':'note';}function pillText(type,label){return '<span class="pill '+pillClass(type)+'">'+label+'</span>';}function renderTabs(){tabs.innerHTML='';keys.forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===current?' active':'');b.textContent=k;b.onclick=()=>{current=k;mode='plan';setBottom();render();};tabs.appendChild(b);});}function plan(){main.innerHTML='<div class="daytitle"><h2>'+current+'</h2><span class="tag">'+META[current]+'</span></div><div class="note">景點與店家名稱可直接點開高德地圖；用這版就能直接查路線與導航。</div>'+DATA[current].map(x=>'<div class="item '+cls(x[1],x[2])+'"><div class="time">'+x[0]+'</div><div class="icon">'+x[1]+'</div><div class="desc">'+linkPlaces(x[2])+'</div><div class="arrow">›</div></div>').join('')+'<div class="footerpoem">旅程不是趕路，是把喜歡的地方慢慢走進記憶裡。</div>';}function map(){const ks=['總覽','9/12','9/13','9/14','9/15','9/16','9/17','9/18'];const tabsHtml=ks.map(k=>'<button class="maptab '+(k===mapCurrent?'active':'')+'" data-map="'+k+'">'+(k==='總覽'?'9/12–9/18 總覽':k)+'</button>').join('');const img=(window.APP_IMAGES||{})[mapCurrent];main.innerHTML='<div class="sectiontitle"><h2>行程地圖</h2><span class="tag">總覽＋每日路線</span></div><div class="maptabs">'+tabsHtml+'</div>'+(img?'<div class="mapwrap"><img src="'+img+'" alt="'+mapCurrent+' 行程圖"></div>':'<div class="note">地圖載入中，請重新整理頁面。</div>')+'<div class="mapcaption">'+(mapCurrent==='總覽'?'9/12–9/18 總地圖':mapCurrent+' 每日手繪行程圖')+'</div><div class="zoomhint">可雙指放大查看細節；點上方日期切換每日路線。</div>';document.querySelectorAll('.maptab').forEach(b=>b.onclick=()=>{mapCurrent=b.dataset.map;map();});}function todo(){let html='<div class="sectiontitle"><h2>預約清單</h2><span class="tag">出發前完成</span></div><div class="note">以下已整合你圖片中的預約資料。需要處理的項目我分成高優先與備忘兩區。</div>';TODO_GROUPS.forEach((g,gi)=>{html+='<div class="sectiontitle"><h2 style="font-size:20px">'+g.title+'</h2><span class="tag">'+g.items.length+' 項</span></div>';html+=g.items.map((x,i)=>'<label class="check"><input type="checkbox" data-k="g'+gi+'-'+i+'"><span><strong>'+x[0]+'｜'+linkPlaces(x[1])+'</strong><span class="reserve-meta">'+x[2]+'</span>'+pillText(x[4],x[3])+'</span></label>').join('');});main.innerHTML=html;document.querySelectorAll('.check input').forEach(e=>{const k='todo-v93-'+e.dataset.k;e.checked=localStorage.getItem(k)==='1';e.onchange=()=>localStorage.setItem(k,e.checked?'1':'0');});}function backup(){let content='<div class="sectiontitle"><h2>備用清單</h2><span class="tag">空檔可補</span></div><div class="subtabs"><button class="subtab '+(backupMode==='spots'?'active':'')+'" id="subSpots">備用景點</button><button class="subtab '+(backupMode==='reserve'?'active':'')+'" id="subReserve">預約備忘</button></div>';if(backupMode==='spots'){content+='<div class="note">點擊景點名稱可直接開啟高德地圖。這一區是上海市區的彈性備案，適合下雨、體力不足或突然多出空檔時使用。</div>'+BACKUP.map(x=>'<div class="item"><div class="time">備選</div><div class="icon">📍</div><div class="desc">'+linkPlaces(x)+'</div><div class="arrow">›</div></div>').join('');}else{const flat=TODO_GROUPS.flatMap(g=>g.items);content+='<div class="note">這裡同步收錄預約方式與緊急度，方便你在旅程中快速補查。</div>'+flat.map(x=>'<div class="item"><div class="time">'+x[0]+'</div><div class="icon">📝</div><div class="desc"><strong>'+linkPlaces(x[1])+'</strong><br><span class="reserve-meta">'+x[2]+'</span>'+pillText(x[4],x[3])+'</div><div class="arrow">›</div></div>').join('');}main.innerHTML=content;document.getElementById('subSpots').onclick=()=>{backupMode='spots';backup();};document.getElementById('subReserve').onclick=()=>{backupMode='reserve';backup();};}function render(){renderTabs();if(mode==='map')map();else if(mode==='todo')todo();else if(mode==='backup')backup();else plan();}function setBottom(){btnPlan.classList.toggle('active',mode==='plan');btnMap.classList.toggle('active',mode==='map');btnTodo.classList.toggle('active',mode==='todo');btnBackup.classList.toggle('active',mode==='backup');}btnPlan.onclick=()=>{mode='plan';setBottom();render();};btnMap.onclick=()=>{mode='map';setBottom();render();};btnTodo.onclick=()=>{mode='todo';setBottom();render();};btnBackup.onclick=()=>{mode='backup';setBottom();render();};if(window.APP_IMAGES&&APP_IMAGES.bg){document.body.style.backgroundImage='linear-gradient(rgba(250,245,235,.68),rgba(250,245,235,.68)),url('+APP_IMAGES.bg+')';document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center top';document.body.style.backgroundAttachment='fixed';}const trip=new Date('2026-09-12T07:05:00+08:00'),now=new Date(),diff=trip-now;document.getElementById('countdown').textContent=diff>0?'距離出發還有 '+Math.ceil(diff/86400000)+' 天':'旅程已開始／完成';if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}render();</script></body></html>
