<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8d3a2f"><title>上海行程｜手繪版重新載入</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f6eddc;color:#33271f;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{max-width:420px;background:#fffaf1;border:1px solid #decba9;border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(83,56,29,.12)}h1{font-size:26px;margin:0 0 12px}.small{color:#75695e;line-height:1.7;font-size:14px}.seal{display:inline-block;background:#963f34;color:#fff;padding:5px 10px;border-radius:8px;margin-bottom:12px;font-weight:800}</style></head><body><div class="box"><div class="seal">V9.5 RESET</div><h1>正在切換到手繪中國風版本</h1><div class="small" id="msg">會先清除舊的 V9.4 fix2 快取，再重新載入真正的手繪背景與每日行程圖。</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}localStorage.setItem('shanghai-handdrawn-reset','20260912-0430');document.getElementById('msg').textContent='舊快取已清除，正在重新載入…';setTimeout(()=>location.replace('./index.html?assetset=handdrawn2337&cb=202609120430'),900);}catch(e){location.replace('./index.html?assetset=handdrawn2337&cb=202609120430');}})();</script></body></html>
